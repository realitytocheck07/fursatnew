</style></head><body>
<section id="title" class="clip" data-start="0.3" data-duration="2.1"><div id="plaque"><h1>Inside <b>Fursat</b></h1><i></i></div></section>
<section id="end" class="clip" data-start="0" data-duration="1.76"><img class="el" src="assets/brand/fursat-elephant.webp" alt=""><img class="wm" src="assets/brand/fursat-wordmark.png" alt="Fursat"><div id="shim"></div></section>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const eio=x=>{x=Math.min(1,Math.max(0,x));return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}; // ease-in-out, one pass, no overshoot
window.seek=(scene,t)=>{
  const T=document.getElementById('title'),E=document.getElementById('end');
  T.classList.toggle('on',scene==='title');E.classList.toggle('on',scene==='end');
  if(scene==='title'){ // t relative to the title clip (0..2.1): fade/rise in 0.5s, fade out last 0.4s
    const inn=ease(t/0.5),out=ease((2.1-t)/0.4),o=Math.min(inn,out);
    const p=document.getElementById('plaque');p.style.opacity=o;
    p.style.transform=`translate(-50%,calc(-50% + ${(1-inn)*16}px))`;
    document.querySelector('#plaque i').style.transform=`scaleX(${ease((t-0.25)/0.6)})`;
  }
  if(scene==='end'){ // one gold shimmer pass over the logo (0.56 s -> 1.44 s of the end clip); band centre travels x=-260 -> 980 (page px)
    const p=eio((t-0.56)/0.88), cx=-260+p*1240;
    document.getElementById('shim').style.backgroundPosition=(cx-900)+'px 0';
  }
};
</script></body></html>
